    <style>
        /* =========================================================
           MOBILE ACTION BAR
           ========================================================= */

        #mobile-action-bar {
            display: flex !important;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            background: var(--navy-dark);

            gap: 10px;

            padding:
                12px
                16px
                calc(12px + env(safe-area-inset-bottom, 0px));

            align-items: stretch;

            z-index: 200;

            box-shadow:
                0 -4px 16px rgba(17,45,96,0.18);
        }

        #mobile-action-bar .btn {
            flex: 1;

            padding: 13px 6px;

            font-size: 14px;
            font-weight: 600;

            border-radius: 10px;

            min-width: 0;

            white-space: nowrap;
        }

        #mobile-action-bar .btn-outline {
            background: rgba(255,255,255,0.10);

            border: 1.5px solid rgba(255,255,255,0.30);

            color: #ffffff;
        }

        #mobile-action-bar .btn-outline:active {
            background: rgba(255,255,255,0.20);
        }

        #mobile-action-bar .btn-primary {
            background: #ffffff;

            color: var(--navy-dark);

            border: none;

            box-shadow: none;

            font-weight: 700;
        }

        #mobile-action-bar .btn-primary:active {
            background: #e8f0fe;
        }


        /* =========================================================
           DESKTOP
           ========================================================= */

        @media (min-width: 1024px) {
            #mobile-action-bar {
                display: none !important;
            }
        }


        /* =========================================================
           LANDSCAPE PHONE
           ========================================================= */

        @media (orientation: landscape) and (max-height: 500px) {

            #mobile-action-bar {
                display: grid !important;

                grid-template-columns:
                    1fr
                    1fr
                    1fr;

                grid-template-rows:
                    auto
                    auto;

                gap: 6px;

                padding:
                    6px
                    max(16px, env(safe-area-inset-right, 0px))
                    calc(6px + env(safe-area-inset-bottom, 0px))
                    max(16px, env(safe-area-inset-left, 0px));
            }

            #mobile-action-bar .btn {
                padding: 9px 4px;

                font-size: 12px;

                border-radius: 8px;
            }

            #mobile-action-bar .btn-primary {
                grid-column: 1 / -1;

                padding: 9px;

                font-size: 13px;
            }

            .app-main {
                padding-bottom: 100px;
            }
        }


        /* =========================================================
           KPI ICONS
           ========================================================= */

        .kpi-icon svg {
            width: 20px;
            height: 20px;
        }


        /* =========================================================
           SIDEBAR BRAND
           ========================================================= */

        .sidebar-brand {
            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================================================
           SIDEBAR ACTIVE INDICATOR
           ========================================================= */

        .sidebar-btn {
            position: relative;
        }

        .sidebar-btn.active::before {
            content: '';

            position: absolute;

            left: -10px;
            top: 18%;
            bottom: 18%;

            width: 3px;

            border-radius: 0 3px 3px 0;

            background: #60a5fa;
        }
    </style>

    <script>
        /*
        ============================================================
        KPI ICON OVERRIDE
        ============================================================

        IMPORTANT:

        Do NOT use MutationObserver here.

        Previous implementation:
            MutationObserver
                -> innerHTML change
                -> mutation
                -> observer
                -> innerHTML change
                -> mutation
                -> infinite loop

        This implementation does NOT observe DOM mutations.

        Instead:
            - wait until DOM is ready
            - try once
            - if KPI row is not populated yet, use a very small
              one-time delayed retry
            - NEVER observe subtree
            - NEVER create an infinite mutation loop
        ============================================================
        */

        (function () {

            const kpiIcons = {
                'total-sales':
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
                        '<line x1="12" y1="1" x2="12" y2="23"/>' +
                        '<path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' +
                    '</svg>',

                'total-bills':
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
                        '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
                        '<polyline points="14 2 14 8 20 8"/>' +
                        '<line x1="16" y1="13" x2="8" y2="13"/>' +
                        '<line x1="16" y1="17" x2="8" y2="17"/>' +
                    '</svg>',

                'avg-bill':
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
                        '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>' +
                    '</svg>',

                'top-product':
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
                        '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' +
                    '</svg>'
            };


            function applyKpiIcons() {

                const kpiRow =
                    document.getElementById('kpi-row');

                if (!kpiRow) {
                    return;
                }


                const icons =
                    kpiRow.querySelectorAll('.kpi-icon');


                if (!icons.length) {
                    return;
                }


                const keys =
                    Object.keys(kpiIcons);


                icons.forEach(function (element, index) {

                    const key = keys[index];

                    if (!key) {
                        return;
                    }


                    /*
                    Only update when necessary.

                    This prevents unnecessary DOM writes and
                    completely avoids a mutation cycle.
                    */

                    if (element.dataset.kpiIconApplied === key) {
                        return;
                    }


                    element.innerHTML =
                        kpiIcons[key];


                    const svg =
                        element.querySelector('svg');


                    if (svg) {
                        svg.style.width = '20px';
                        svg.style.height = '20px';
                    }


                    element.dataset.kpiIconApplied = key;
                });
            }


            document.addEventListener(
                'DOMContentLoaded',
                function () {

                    /*
                    First attempt.
                    */

                    applyKpiIcons();


                    /*
                    billing.js may populate KPI cards after
                    DOMContentLoaded.

                    Give it a few safe opportunities.

                    No MutationObserver.
                    No recursive callback.
                    No infinite loop.
                    */

                    setTimeout(applyKpiIcons, 50);
                    setTimeout(applyKpiIcons, 150);
                    setTimeout(applyKpiIcons, 300);
                    setTimeout(applyKpiIcons, 600);
                }
            );

        })();
    </script>
</head>
